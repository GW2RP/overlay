[package]
name = "gw2rp-overlay"
version = "1.5.1"
description = "L'overlay de jeu du hub GW2RP Nexus : météo et lieux de RP à l'emplacement du personnage."
authors = ["La communauté GW2RP"]
edition = "2021"
publish = false

[lib]
# Le nom de la bibliothèque ne doit pas être celui du binaire : `tauri` en
# dérive le point d'entrée des plateformes mobiles, et le même nom pour les deux
# fait échouer l'édition de liens sous Windows.
name = "gw2rp_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Le lecteur de l'archive du jeu vit dans son propre crate, membre de l'espace
# de travail : un seul verrou, un seul dossier de compilation, et `fmt`,
# `clippy` et `test` le couvrent avec `--workspace`.
[workspace]
members = [".", "archive-gw2", "serveur-mcp"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` : l'icône de la zone de notification, ce qui dit que l'application
# tourne quand toutes ses fenêtres sont rangées. `image-png` : pour la décoder
# depuis la marque à 128 px plutôt que de reprendre celle de la fenêtre.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Chaque greffon existe en deux moitiés, le crate et le paquet npm, et le CLI
# de Tauri refuse de construire si leurs versions majeure et mineure diffèrent.
# Les mineures sont donc écrites ici, égales à celles de `package.json` : une
# montée de version se fait des deux côtés à la fois.
tauri-plugin-http = "2.6"
tauri-plugin-store = "2.4"
tauri-plugin-global-shortcut = "2.3"
# La mise à jour automatique, depuis les releases GitHub du dépôt.
tauri-plugin-updater = "2.12"
# Les liens vers le hub s'ouvrent dans le navigateur, jamais dans la vue web.
tauri-plugin-opener = "2.5"
# Les boîtes de choix de dossier et d'enregistrement de l'éditeur de pavillon.
# Le crate seul, sans son paquet npm : elles s'ouvrent depuis Rust, et le front
# n'a pas de chemin à nommer.
tauri-plugin-dialog = "2"
# La lecture de l'archive du jeu, pour les modèles du pavillon : un crate à
# part, sans dépendance, qui se compile et se teste hors de Windows.
archive-gw2 = { path = "archive-gw2" }
# Le serveur MCP local de l'éditeur de pavillon : le protocole et ses
# garde-fous, dans un crate à part qui se teste hors de Windows.
serveur-mcp = { path = "serveur-mcp" }
# Le jeton du serveur MCP : tiré du générateur du système.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# La mémoire partagée de Mumble Link n'existe que sous Windows, comme le jeu.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Memory",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
