name: Publier

# Se déclenche quand une release `v*` est publiée sur GitHub, et à la demande
# pour rejouer l'attache sur une release existante. Il n'écrit pas la release :
# les notes restent écrites à la main, et il y attache les installeurs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Le tag de la release à compléter (v1.2.3)"
        required: true
        type: string

# Nécessaire pour attacher les installeurs à la release.
permissions:
  contents: write

jobs:
  windows:
    name: Installeurs Windows
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      # À la demande, le tag est saisi à la main : on le vérifie avant d'en
      # extraire quoi que ce soit, sinon `1.2.3`, une branche ou un SHA
      # construirait depuis une référence que personne n'a voulu publier.
      - name: Vérifier la forme du tag
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Le tag « $env:TAG » n'a pas la forme v1.2.3."
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Le tag conduit la release, mais le nom des installeurs vient de
      # tauri.conf.json. Un écart publierait `v1.2.0` avec un
      # `GW2RP Overlay_1.1.0_x64-setup.exe` : on refuse de construire plutôt.
      - name: Vérifier que le tag correspond aux versions déclarées
        run: |
          $attendue = $env:TAG.TrimStart('v')

          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $paquet = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $ligne = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1
          $cargo = $ligne.Matches[0].Groups[1].Value

          Write-Host "tag=$env:TAG tauri.conf.json=$tauri package.json=$paquet Cargo.toml=$cargo"

          $ecarts = @()
          if ($tauri -ne $attendue) { $ecarts += "tauri.conf.json ($tauri)" }
          if ($paquet -ne $attendue) { $ecarts += "package.json ($paquet)" }
          if ($cargo -ne $attendue) { $ecarts += "Cargo.toml ($cargo)" }

          if ($ecarts.Count -gt 0) {
            throw "Le tag $env:TAG ne correspond pas : $($ecarts -join ', '). Alignez les versions avant de publier."
          }

      # Sans clé publique, l'application ne peut vérifier ce qu'elle
      # télécharge : le greffon refuserait la release que ce passage publie.
      # Dit ici plutôt que découvert par les utilisateurs après coup.
      - name: Vérifier que la mise à jour automatique est configurée
        run: |
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey

          if ([string]::IsNullOrWhiteSpace($pubkey)) {
            throw 'plugins.updater.pubkey est vide. Générez une paire de clés (voir README) et rangez la privée dans les secrets du dépôt avant de publier.'
          }

      # À la demande, la release peut manquer : vérifié ici plutôt qu'après
      # quatre minutes de compilation.
      - name: Vérifier que la release existe
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $existe = $false
          try {
            gh release view $env:TAG *> $null
            $existe = $LASTEXITCODE -eq 0
          } catch {
            $existe = $false
          }

          if (-not $existe) {
            throw "Aucune release pour $env:TAG. Créez-la, puis relancez ce workflow."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache des empaqueteurs Tauri
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-${{ runner.os }}-

      - name: Installer les dépendances
        run: npm ci

      - name: Typer
        run: npm run typecheck

      # Voir verifier.yml : tout ce qui compile le crate a besoin de ../dist.
      - name: Construire le front
        run: npm run build

      # `updater.conf.json` ajoute `createUpdaterArtifacts`, ce qui fait signer
      # les installeurs par l'empaqueteur. Tenu hors de tauri.conf.json pour que
      # `verifier.yml`, qui n'a pas de clé, continue de construire.
      - name: Construire les installeurs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Le chemin se résout depuis le dossier de travail, pas depuis src-tauri.
        run: npm run tauri build -- --config src-tauri/updater.conf.json

      # La release est écrite à la main, notes comprises ; ceci n'y accroche que
      # les installeurs. En créer une ici doublerait celle qui vient d'être
      # publiée.
      - name: Attacher les installeurs à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `-ErrorAction SilentlyContinue` : un dossier d'empaquetage absent
          # est exactement ce que le contrôle ci-dessous signale, et laisser
          # Get-ChildItem lever d'abord l'enterrerait.
          $fichiers = @(
            Get-ChildItem -Path 'src-tauri/target/release/bundle/msi/*.msi' -File -ErrorAction SilentlyContinue
            Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction SilentlyContinue
          )

          if ($fichiers.Count -eq 0) {
            throw "tauri build n'a produit aucun installeur."
          }

          $fichiers | ForEach-Object { Write-Host "attache $($_.Name)" }

          # Éclaté, pas interpolé : passé en ligne, le tableau se joindrait en
          # un seul argument, et les noms d'installeur portent une espace
          # (« GW2RP Overlay_1.0.0_x64-setup.exe »).
          #
          # `--clobber` : relancer après un build raté remplace les fichiers au
          # lieu de s'arrêter sur ceux déjà téléversés.
          $arguments = @('release', 'upload', $env:TAG) +
            $fichiers.FullName +
            @('--clobber')

          gh @arguments

      # Ce que l'application en marche lit pour apprendre qu'une version plus
      # récente existe. Écrit après le téléversement : il doit porter l'adresse
      # que GitHub a réellement donnée à l'installeur — les noms de fichiers
      # attachés ne sont pas les noms sur disque, les espaces deviennent des
      # points.
      - name: Publier le manifeste de mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installeur = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File |
            Select-Object -First 1

          if (-not $installeur) {
            throw "Aucun installeur NSIS à annoncer."
          }

          # L'empaqueteur l'écrit à côté de l'installeur, et seulement s'il a
          # une clé. Son absence veut dire une release que le greffon refusera.
          $signature = "$($installeur.FullName).sig"
          if (-not (Test-Path $signature)) {
            throw "Pas de signature à côté de $($installeur.Name). TAURI_SIGNING_PRIVATE_KEY est-il dans les secrets du dépôt ?"
          }

          $url = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" `
            --jq '.assets[] | select(.name | endswith("-setup.exe")) | .browser_download_url' |
            Select-Object -First 1

          if (-not $url) {
            throw "L'installeur n'est pas parmi les fichiers de la release."
          }

          # Les notes sont celles de la release ; l'écran de mise à jour les
          # montre. Recollées : PowerShell rend la sortie d'une commande native
          # en tableau de lignes dès qu'il y en a plus d'une, et ConvertTo-Json
          # écrirait un tableau là où le greffon attend une chaîne.
          $notes = (gh release view $env:TAG --json body --jq .body) -join "`n"

          $manifeste = [ordered]@{
            version   = $env:TAG.TrimStart('v')
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('o')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $signature -Raw).Trim()
                url       = $url
              }
            }
          }

          $manifeste | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

          # Relu et vérifié contre ce que le greffon accepte : un manifeste
          # qu'il ne sait pas lire passe pour « aucune mise à jour », et une
          # erreur ici serait silencieuse pour tous ceux qui ont installé.
          $relu = Get-Content latest.json -Raw | ConvertFrom-Json

          if ($relu.notes -isnot [string]) {
            throw "Les notes du manifeste doivent être une seule chaîne, reçu $($relu.notes.GetType().Name)."
          }
          if ([string]::IsNullOrWhiteSpace($relu.platforms.'windows-x86_64'.signature)) {
            throw "Le manifeste ne porte pas de signature."
          }

          Write-Host "annonce $url"

          gh release upload $env:TAG latest.json --clobber
