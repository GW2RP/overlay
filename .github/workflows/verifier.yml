name: Vérifier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push remplace le passage précédent sur la même référence.
concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Les chaînes NSIS et WiX sont téléchargées par l'empaqueteur de Tauri au
      # premier passage ; les garder épargne quelques minutes par passage.
      - name: Cache des empaqueteurs Tauri
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-${{ runner.os }}-

      - name: Installer les dépendances
        run: npm ci

      - name: Typer
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Avant tout ce qui compile le crate : `build.rs` appelle
      # `tauri_build::build()`, qui résout `frontendDist` (../dist) et échoue
      # s'il manque. `cargo fmt` ne compile pas, il n'en dépend pas.
      - name: Construire le front
        run: npm run build

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Construire les installeurs
        run: npm run tauri build

      - name: Publier les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: gw2rp-overlay-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
